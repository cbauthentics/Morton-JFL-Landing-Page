<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />

  <title>Morton JFL Team Store | Launching August 21</title>
  <meta name="description" content="The Morton JFL Team Store launches August 21. Official Morton JFL apparel for players, parents, coaches, and fans." />

  <meta property="og:title" content="Morton JFL Team Store | Launching August 21" />
  <meta property="og:description" content="Official Morton JFL apparel for players, parents, coaches, and fans. Launching August 21." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="morton-jfl-launch-poster.png" />

  <style>
    :root {
      --bg: #050505;
      --panel: #0d0d0d;
      --red: #d71920;
      --white: #f5f5f5;
      --muted: #b8b8b8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at top, rgba(120,0,0,.20), transparent 34%),
        linear-gradient(180deg, #090909 0%, #020202 100%);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 1120px;
      padding: 24px 18px 40px;
    }

    .topbar {
      text-align: center;
      margin-bottom: 18px;
    }

    .eyebrow {
      color: var(--red);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 64px);
      line-height: .95;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subhead {
      margin: 10px auto 0;
      max-width: 700px;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 19px);
      line-height: 1.5;
    }

    .poster-wrap {
      margin: 22px auto 26px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .poster {
      display: block;
      width: min(100%, 820px);
      height: auto;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.65);
    }

    .launch-card {
      margin: 0 auto;
      max-width: 820px;
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
      border: 1px solid rgba(255,255,255,.09);
      border-top: 3px solid var(--red);
      padding: 24px 18px;
      text-align: center;
    }

    .launch-card h2 {
      margin: 0 0 8px;
      color: var(--white);
      font-size: clamp(26px, 4vw, 42px);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .date {
      color: var(--red);
      font-weight: 900;
    }

    .launch-card p {
      margin: 0 auto;
      max-width: 680px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 16px;
    }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 18px;
      border: 1px solid rgba(255,255,255,.14);
      background: #111;
      color: #fff;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      color: #777;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .page { padding: 16px 10px 28px; }
      .topbar { margin-bottom: 12px; }
      .poster-wrap { margin-top: 16px; }
      .launch-card { padding: 20px 14px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="eyebrow">Morton JFL</div>
      <h1>Team Store Coming Soon</h1>
      <p class="subhead">
        Official Morton JFL apparel for players, parents, coaches, and fans.
      </p>
    </header>

    <section class="poster-wrap">
      <img
        class="poster"
        src="morton-jfl-launch-poster.png"
        alt="Morton JFL Team Store launching August 21"
      />
    </section>

    <section class="launch-card">
      <h2>Launching <span class="date">August 21</span></h2>
      <p>
        The Morton JFL Team Store is almost here. Check back on launch day to shop the full collection.
      </p>
      <div class="status">Store Opens August 21</div>
    </section>

    <footer>Morton JFL Team Store</footer>
  </main>
</body>
</html>
